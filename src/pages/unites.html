🔹 Exercice 1 — Différence px vs %

Crée une div parent de 500px de largeur.
À l’intérieur, crée deux blocs :

un en width: 250px
un en width: 50%

👉 Objectif : comprendre la différence entre valeur fixe et relative.

🔹 Exercice 2 — Utiliser em

Définis :

body {
font-size: 16px;
}

Puis crée un paragraphe avec :

font-size: 2em;
}

👉 Question : quelle est la taille finale ?
👉 Ensuite imbrique un span avec font-size: 1.5em → observe l’effet cumulatif.

🔹 Exercice 3 — Utiliser rem

👉 Objectif : comprendre pourquoi rem est plus stable que em.

un conteneur

}

}
