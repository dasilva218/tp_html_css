<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Exercices - NEJDev241</title>
    <style>
        /* Style global */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }

        /* Navigation Horizontale */
        nav {
            background-color: #2c3e50;
            padding: 1rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        nav ul li a:hover {
            color: #3498db;
        }

        /* Contenu */
        main {
            text-align: center;
            padding: 80px 20px;
        }
        h1 { color: #2c3e50; margin-bottom: 15px; }
        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #95a5a6;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="src/pages/selecteur.html">Exercice 2 : Sélecteurs</a></li>
            <li><a href="src/pages/textes.html">Exercice 3 : Textes</a></li>
        </ul>
    </nav>

    <main>
        <h1>Plateforme d'Apprentissage CSS</h1>
        <p>Bienvenue. Sélectionnez un module ci-dessus pour visualiser les exercices.</p>
    </main>

    <footer>NEJDev241</footer>

</body>
</html>
